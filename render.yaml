services:
  - type: web
    name: apex-exam-taker-system
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build && cd server && npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
